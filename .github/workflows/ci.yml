name: CI

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-2022
        include:
          - os: macos-latest
            cmake_options: "-DCMAKE_TOOLCHAIN_FILE=conan_toolchain.cmake -DCMAKE_BUILD_TYPE=Release"
            build_config: Release
          - os: windows-2022
            cmake_options: "-DCMAKE_TOOLCHAIN_FILE=conan_toolchain.cmake"
            build_config: Release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: 'true'
      - name: Check translations
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          for f in po/*.po; do grep -LE '^msgid "translator-credits"' $f ; done
      - name: Install Conan
        uses: conan-io/setup-conan@v1
        with:
          cache_packages: 'true'
      - name: Install Ubuntu Build Dependencies
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          sudo apt update
          sudo apt install gettext zlib1g-dev libwxgtk3.2-dev libgtk-3-dev libssl-dev libssh2-1-dev libsasl2-dev liblzo2-dev
      - name: Install MacOS Build Dependencies
        if: ${{ matrix.os == 'macos-latest' }}
        run: |
          conan install . --output-folder=build --build=missing --settings=build_type=Release
      - name: Install Windows Build Dependencies
        if: ${{ matrix.os == 'windows-2022' }}
        run: |
          conan install . --output-folder=build --build=missing --settings=build_type=Release
      - name: Build
        shell: bash
        run: |
          mkdir -p build
          cd build
          cmake ${{ matrix.cmake_options }} ..
          cmake --build . --config ${{ matrix.build_config || 'Debug' }}
          cpack -V -C ${{ matrix.build_config || 'Debug' }}
      - name: Archive Ubuntu Build Artifacts
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: MultiVNC Debian Package
          path: build/*.deb
      - name: Archive MacOS Build Artifacts
        if: ${{ matrix.os == 'macos-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: MultiVNC MacOS Package
          path: build/*.dmg
      - name: Archive Windows Build Artifacts
        if: ${{ matrix.os == 'windows-2022' }}
        uses: actions/upload-artifact@v4
        with:
          name: MultiVNC Windows Package
          path: build/*.msi

  # On tag pushes (e.g. `git tag v0.11.0 && git push --tags`), gather the
  # per-OS packages built above and attach them to the GitHub Release for the
  # tag. A single job (rather than one per matrix OS) avoids a race on release
  # creation.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect package files
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.msi' -o -name '*.dmg' -o -name '*.deb' \) -exec cp {} release-assets/ \;
          ls -l release-assets
      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          fi
